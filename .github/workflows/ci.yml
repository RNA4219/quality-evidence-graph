name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      qeg_report_targets:
        description: QEG report targets for a manual demo run
        required: false
        default: fixtures/negative-approval-missing

permissions:
  contents: read

env:
  QEG_REPORT_TARGETS: ${{ inputs.qeg_report_targets || 'fixtures/positive-release-go' }}

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm ci

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: Build
        id: build
        continue-on-error: true
        run: npm run build

      - name: Parse JSON contracts
        id: json_parse
        continue-on-error: true
        run: |
          node -e "const fs=require('fs'); for (const f of fs.readdirSync('schemas').filter(f=>f.endsWith('.json'))) JSON.parse(fs.readFileSync('schemas/'+f,'utf8')); JSON.parse(fs.readFileSync('docs/birdseye/index.json','utf8')); for (const f of fs.readdirSync('docs/birdseye/caps').filter(f=>f.endsWith('.json'))) JSON.parse(fs.readFileSync('docs/birdseye/caps/'+f,'utf8')); console.log('json ok')"

      - name: Package dry-run
        id: pack
        continue-on-error: true
        run: npm pack --dry-run --cache ./.npm-cache

      - name: QEG cumulative report
        id: qeg_report
        if: always()
        uses: ./qeg-report-action
        with:
          install-command: ""
          build-command: ""
          targets: ${{ env.QEG_REPORT_TARGETS }}
          output-path: .qeg/qeg-ci-report.json
          github-summary: "true"
          report-command: node dist/cli.js
          artifact-name: qeg-ci-report

      - name: Final CI verdict
        if: always()
        uses: actions/github-script@v9.0.0
        env:
          STEP_INSTALL: ${{ steps.install.outcome }}
          STEP_TYPECHECK: ${{ steps.typecheck.outcome }}
          STEP_BUILD: ${{ steps.build.outcome }}
          STEP_JSON_PARSE: ${{ steps.json_parse.outcome }}
          STEP_PACK: ${{ steps.pack.outcome }}
          STEP_QEG_REPORT: ${{ steps.qeg_report.outcome }}
          QEG_REPORT_EXIT_CODE: ${{ steps.qeg_report.outputs.exit_code }}
        with:
          script: |
            const checks = [
              ['install', process.env.STEP_INSTALL],
              ['typecheck', process.env.STEP_TYPECHECK],
              ['build', process.env.STEP_BUILD],
              ['json_parse', process.env.STEP_JSON_PARSE],
              ['pack', process.env.STEP_PACK],
            ];
            const qegReportExitCode = Number(process.env.QEG_REPORT_EXIT_CODE || '1');

            for (const [name, outcome] of checks) {
              core.info(`${name}: ${outcome}`);
            }
            core.info(`qeg_report: ${process.env.STEP_QEG_REPORT}, exit ${qegReportExitCode}`);

            const failed = checks
              .filter(([, outcome]) => outcome === 'failure')
              .map(([name]) => name);
            if (qegReportExitCode !== 0) {
              failed.push(`qeg_report(exit ${qegReportExitCode})`);
            }
            if (failed.length > 0) {
              const names = failed.join(', ');
              core.setFailed(
                `QEG CI failed after collecting diagnostics. Failed step(s): ${names}. ` +
                `See the qeg-ci-report artifact and the job summary for cumulative missing evidence and gate failures.`
              );
            }
