name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      qeg_report_targets:
        description: QEG report targets for a manual demo run
        required: false
        default: fixtures/negative-approval-missing

permissions:
  contents: read

env:
  QEG_REPORT_TARGETS: ${{ inputs.qeg_report_targets || 'fixtures/positive-release-go' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm ci

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: Build
        id: build
        continue-on-error: true
        run: npm run build

      - name: Public type contracts
        id: types
        continue-on-error: true
        run: npm run test:types

      - name: Runtime and action contracts
        id: runtime
        continue-on-error: true
        run: npm run test:runtime

      - name: Release lifecycle acceptance
        id: release_lifecycle
        continue-on-error: true
        run: npm run test:release-lifecycle -- --out .qeg/action-lifecycle-node-${{ matrix.node-version }}/evidence.json

      - name: Upload release lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: qeg-action-lifecycle-node-${{ matrix.node-version }}
          path: .qeg/action-lifecycle-node-${{ matrix.node-version }}
          if-no-files-found: warn

      - name: Schema validation
        id: schema
        continue-on-error: true
        run: npm run schema-check

      - name: Enum consistency
        id: enum
        continue-on-error: true
        run: npm run enum-check

      - name: Fixture and snapshot regression
        id: fixtures
        continue-on-error: true
        run: npm run test:fixtures

      - name: Package install smoke
        id: package_smoke
        continue-on-error: true
        run: npm run test:package

      - name: Birdseye freshness
        id: birdseye
        continue-on-error: true
        run: npm run birdseye-check

      - name: Parse all tracked JSON
        id: json_parse
        continue-on-error: true
        run: npm run json-check

      - name: Package dry-run
        id: pack
        continue-on-error: true
        run: npm pack --dry-run --cache ./.npm-cache

      - name: QEG cumulative report
        id: qeg_report
        if: always()
        uses: ./qeg-report-action
        with:
          install-command: ""
          build-command: ""
          targets: ${{ env.QEG_REPORT_TARGETS }}
          output-path: .qeg/qeg-ci-report-node-${{ matrix.node-version }}.json
          github-summary: "true"
          artifact-name: qeg-ci-report-node-${{ matrix.node-version }}
          enforce: "false"

      - name: Final CI verdict
        if: always()
        uses: actions/github-script@v9.0.0
        env:
          STEP_INSTALL: ${{ steps.install.outcome }}
          STEP_TYPECHECK: ${{ steps.typecheck.outcome }}
          STEP_BUILD: ${{ steps.build.outcome }}
          STEP_TYPES: ${{ steps.types.outcome }}
          STEP_RUNTIME: ${{ steps.runtime.outcome }}
          STEP_RELEASE_LIFECYCLE: ${{ steps.release_lifecycle.outcome }}
          STEP_SCHEMA: ${{ steps.schema.outcome }}
          STEP_ENUM: ${{ steps.enum.outcome }}
          STEP_FIXTURES: ${{ steps.fixtures.outcome }}
          STEP_PACKAGE_SMOKE: ${{ steps.package_smoke.outcome }}
          STEP_BIRDSEYE: ${{ steps.birdseye.outcome }}
          STEP_JSON_PARSE: ${{ steps.json_parse.outcome }}
          STEP_PACK: ${{ steps.pack.outcome }}
          STEP_QEG_REPORT: ${{ steps.qeg_report.outcome }}
          QEG_REPORT_EXIT_CODE: ${{ steps.qeg_report.outputs.exit_code }}
        with:
          script: |
            const checks = [
              ['install', process.env.STEP_INSTALL],
              ['typecheck', process.env.STEP_TYPECHECK],
              ['build', process.env.STEP_BUILD],
              ['types', process.env.STEP_TYPES],
              ['runtime', process.env.STEP_RUNTIME],
              ['release_lifecycle', process.env.STEP_RELEASE_LIFECYCLE],
              ['schema', process.env.STEP_SCHEMA],
              ['enum', process.env.STEP_ENUM],
              ['fixtures', process.env.STEP_FIXTURES],
              ['package_smoke', process.env.STEP_PACKAGE_SMOKE],
              ['birdseye', process.env.STEP_BIRDSEYE],
              ['json_parse', process.env.STEP_JSON_PARSE],
              ['pack', process.env.STEP_PACK],
            ];
            const qegReportExitCode = Number(process.env.QEG_REPORT_EXIT_CODE || '1');

            for (const [name, outcome] of checks) {
              core.info(`${name}: ${outcome}`);
            }
            core.info(`qeg_report: ${process.env.STEP_QEG_REPORT}, exit ${qegReportExitCode}`);

            const failed = checks
              .filter(([, outcome]) => outcome === 'failure')
              .map(([name]) => name);
            if (qegReportExitCode !== 0) {
              failed.push(`qeg_report(exit ${qegReportExitCode})`);
            }
            if (failed.length > 0) {
              const names = failed.join(', ');
              core.setFailed(
                `QEG CI failed after collecting diagnostics. Failed step(s): ${names}. ` +
                `See the qeg-ci-report artifact and the job summary for cumulative missing evidence and gate failures.`
              );
            }

portability:
    name: portability (windows-24)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Runtime contracts
        run: npm run test:runtime

      - name: Release lifecycle acceptance
        run: npm run test:release-lifecycle -- --out .qeg/action-lifecycle-windows-24/evidence.json

      - name: Upload release lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: qeg-action-lifecycle-windows-24
          path: .qeg/action-lifecycle-windows-24
          if-no-files-found: warn
