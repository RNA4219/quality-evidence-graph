name: QEG cumulative report
description: Run Quality Evidence Graph reporting, upload the JSON artifact, and expose the report exit code.

inputs:
  node-version:
    description: Node.js version used by the action helper steps.
    required: false
    default: "24"
  install-command:
    description: Optional install command. Leave empty when dependencies are already installed.
    required: false
    default: ""
  build-command:
    description: Optional build command. Leave empty when dist/cli.js is already available.
    required: false
    default: ""
  report-command:
    description: Command used to invoke the QEG CLI before report arguments.
    required: false
    default: "npx -y @quality-harness/quality-evidence-graph@latest"
  targets:
    description: Space-separated fixture directories or parent directories to report.
    required: false
    default: ".qeg"
  output-path:
    description: Path for the machine-readable JSON report.
    required: false
    default: ".qeg/qeg-ci-report.json"
  github-summary:
    description: Append a Markdown report to GITHUB_STEP_SUMMARY.
    required: false
    default: "true"
  baseline:
    description: Optional QEG baseline JSON path.
    required: false
    default: ""
  changed-only:
    description: Report only targets related to changed files.
    required: false
    default: "false"
  previous-report:
    description: Optional previous QEG report JSON path used to classify DQs as new, resolved, or unchanged.
    required: false
    default: ""
  artifact-name:
    description: Uploaded artifact name.
    required: false
    default: "qeg-ci-report"
  upload-artifact:
    description: Upload the QEG JSON report artifact.
    required: false
    default: "true"

outputs:
  exit_code:
    description: Exit code returned by qeg report. 0 means pass, 1 means CLI error, 2 means gate failure.
    value: ${{ steps.report.outputs.exit_code }}
  gate_failed:
    description: Number of gate-failed targets in the report.
    value: ${{ steps.report.outputs.gate_failed }}
  cli_errors:
    description: Number of CLI-error targets in the report.
    value: ${{ steps.report.outputs.cli_errors }}
  dq_count:
    description: Total number of disqualifications in the report.
    value: ${{ steps.report.outputs.dq_count }}
  report_path:
    description: Path to the JSON QEG report.
    value: ${{ steps.report.outputs.report_path }}
  summary_markdown_path:
    description: Path to the generated Markdown summary file.
    value: ${{ steps.report.outputs.summary_markdown_path }}

runs:
  using: composite
  steps:
    - name: Setup Node.js
      if: ${{ inputs.node-version != '' }}
      uses: actions/setup-node@v6.4.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install dependencies
      if: ${{ inputs.install-command != '' }}
      shell: bash
      continue-on-error: true
      run: ${{ inputs.install-command }}

    - name: Build package
      if: ${{ inputs.build-command != '' }}
      shell: bash
      continue-on-error: true
      run: ${{ inputs.build-command }}

    - name: Run QEG report
      id: report
      shell: bash
      env:
        QEG_REPORT_COMMAND: ${{ inputs.report-command }}
        QEG_TARGETS: ${{ inputs.targets }}
        QEG_OUTPUT_PATH: ${{ inputs.output-path }}
        QEG_GITHUB_SUMMARY: ${{ inputs.github-summary }}
        QEG_BASELINE: ${{ inputs.baseline }}
        QEG_CHANGED_ONLY: ${{ inputs.changed-only }}
        QEG_PREVIOUS_REPORT: ${{ inputs.previous-report }}
        QEG_SUMMARY_PATH: ${{ inputs.output-path }}.summary.md
      run: |
        mkdir -p "$(dirname "$QEG_OUTPUT_PATH")"
        report_exit=0

        report_args=(report --json --out "$QEG_OUTPUT_PATH")
        if [ "$QEG_GITHUB_SUMMARY" = "true" ]; then
          report_args+=(--github-summary)
        fi
        if [ -n "$QEG_BASELINE" ]; then
          report_args+=(--baseline "$QEG_BASELINE")
        fi
        if [ "$QEG_CHANGED_ONLY" = "true" ]; then
          report_args+=(--changed-only)
        fi
        if [ -n "$QEG_PREVIOUS_REPORT" ]; then
          report_args+=(--diff "$QEG_PREVIOUS_REPORT")
        fi
        if [ -n "$QEG_TARGETS" ]; then
          # Inputs intentionally use whitespace splitting so callers can pass several fixture paths.
          # shellcheck disable=SC2206
          target_args=($QEG_TARGETS)
        else
          target_args=(.qeg)
        fi

        set +e
        # shellcheck disable=SC2086
        $QEG_REPORT_COMMAND "${report_args[@]}" "${target_args[@]}"
        report_exit=$?
        set -e

        if [ ! -f "$QEG_OUTPUT_PATH" ]; then
          node -e "const fs=require('fs'); const report={reportVersion:'qeg-ci-report-v1',generatedAt:new Date().toISOString(),summary:{totalTargets:1,passed:0,baselineAccepted:0,gateFailed:0,cliErrors:1,dqCounts:[],blockerCount:0,residualRiskCount:0,humanReviewCount:0},targets:[{target:process.env.QEG_REPORT_COMMAND,status:'cli_error',exitCode:1,reasons:[],disqualifications:[],blockers:[],residualRisks:[],requiredHumanReview:[],error:'QEG report command failed before producing a report artifact'}]}; fs.writeFileSync(process.env.QEG_OUTPUT_PATH, JSON.stringify(report,null,2)+'\n');"
          if [ "$QEG_GITHUB_SUMMARY" = "true" ] && [ -n "$GITHUB_STEP_SUMMARY" ]; then
            {
              echo "## QEG CI Report"
              echo ""
              echo "- targets: 1"
              echo "- passed: 0"
              echo "- baseline accepted: 0"
              echo "- gate failed: 0"
              echo "- cli errors: 1"
              echo ""
              echo "### Targets"
              echo ""
              echo "- ${QEG_REPORT_COMMAND}: cli_error"
              echo "  - QEG report command failed before producing a report artifact"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          cat "$QEG_OUTPUT_PATH"
          report_exit=1
        fi

        echo "$report_exit" > "$(dirname "$QEG_OUTPUT_PATH")/qeg-report-exit-code.txt"
        node -e "const fs=require('fs'); const report=JSON.parse(fs.readFileSync(process.env.QEG_OUTPUT_PATH,'utf8')); const s=report.summary||{}; const dq=(s.dqCounts||[]).reduce((n,d)=>n+(d.count||0),0); const diff=report.diff; const lines=['## QEG CI Report','',\`- targets: \${s.totalTargets||0}\`,\`- passed: \${s.passed||0}\`,\`- baseline accepted: \${s.baselineAccepted||0}\`,\`- gate failed: \${s.gateFailed||0}\`,\`- cli errors: \${s.cliErrors||0}\`,\`- DQs: \${dq}\`]; if(diff){lines.push(\`- new DQs: \${diff.new?.length||0}\`,\`- resolved DQs: \${diff.resolved?.length||0}\`,\`- unchanged DQs: \${diff.unchanged?.length||0}\`);} lines.push(''); fs.writeFileSync(process.env.QEG_SUMMARY_PATH, lines.join('\n')+'\n'); fs.appendFileSync(process.env.GITHUB_OUTPUT, \`gate_failed=\${s.gateFailed||0}\ncli_errors=\${s.cliErrors||0}\ndq_count=\${dq}\nreport_path=\${process.env.QEG_OUTPUT_PATH}\nsummary_markdown_path=\${process.env.QEG_SUMMARY_PATH}\n\`);"
        echo "exit_code=$report_exit" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Upload QEG report artifact
      if: ${{ always() && inputs.upload-artifact == 'true' }}
      uses: actions/upload-artifact@v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ inputs.output-path }}
          ${{ inputs.output-path }}.summary.md
        if-no-files-found: warn
