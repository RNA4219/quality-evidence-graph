[package]
name = "quality-evidence-graph"
version = "0.4.2"
edition = "2024"
license = "MIT"
description = "Quality Evidence Graph runtime and release gate"
repository = "https://github.com/RNA4219/quality-evidence-graph"
include = ["Cargo.toml", "Cargo.lock", "build.rs", "src-rust/**", "schemas/**", "src/adapters/producer-schemas.json", "src/cli/enum-contracts.json", "qeg-report-action/**", "qeg-report-action/dist/cli.mjs", "bindings/native.mjs", "LICENSE", "README.md"]

[lib]
path = "src-rust/lib.rs"

[[bin]]
name = "qeg"
path = "src-rust/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
hex = "0.4"
indexmap = { version = "2", features = ["serde"] }
jsonschema = { version = "0.61.2", default-features = false }
regex = "1"
ryu-js = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
serde_yaml = "0.9"
yaml-rust2 = "0.10"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_Security"] }
