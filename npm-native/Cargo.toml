[package]
name = "qeg-node"
version = "0.4.2"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
napi = { version = "3", default-features = false, features = ["napi8", "dyn-symbols"] }
napi-derive = { version = "3", default-features = false }
quality-evidence-graph = { path = ".." }
serde_json = "1"

[build-dependencies]
napi-build = "2"
